<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieExplorer</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>


<!-- ================= NAVBAR ================= -->

<header>

    <h1>🎬 MovieExplorer</h1>

    <div class="nav-buttons">

        <button id="favorites-btn">
            ❤️ Favorites
        </button>

        <button id="theme-btn">
            🌙
        </button>

    </div>

</header>



<!-- ================= SEARCH ================= -->

<section class="search-section">

    <input
        type="text"
        id="search-input"
        placeholder="Search movies..."
    >

    <button id="search-btn">
        Search
    </button>

</section>



<!-- ================= LOADER ================= -->

<div id="loader">

    <div class="spinner"></div>

</div>



<!-- ================= MOVIES ================= -->

<section>

    <div id="movies-container">

        <!-- Movie Cards Generated Here -->

    </div>

</section>




<!-- ================= PAGINATION ================= -->

<section class="pagination">

    <button id="prev-btn">

        ◀ Previous

    </button>


    <span id="page-number">

        Page 1

    </span>



    <button id="next-btn">

        Next ▶

    </button>

</section>





<!-- ================= FAVORITES ================= -->

<section id="favorites-section">


    <h2>

        ❤️ My Favorites

    </h2>



    <div id="favorites-container">

        <!-- Favorite Movies -->

    </div>


</section>






<!-- ================= DETAILS MODAL ================= -->

<div id="movie-modal">


    <div class="modal-content">


        <button id="close-modal">

            ✖

        </button>



        <img
            id="modal-poster"
            src=""
            alt=""
        >



        <h2 id="modal-title">

            Movie Title

        </h2>



        <p>

            <strong>⭐ Rating :</strong>

            <span id="modal-rating"></span>

        </p>



        <p>

            <strong>🎭 Genre :</strong>

            <span id="modal-genre"></span>

        </p>



        <p>

            <strong>⏳ Runtime :</strong>

            <span id="modal-runtime"></span>

        </p>



        <p>

            <strong>🎬 Director :</strong>

            <span id="modal-director"></span>

        </p>



        <p>

            <strong>👥 Cast :</strong>

            <span id="modal-cast"></span>

        </p>



        <p>

            <strong>📖 Plot :</strong>

            <span id="modal-plot"></span>

        </p>



    </div>

</div>

</html>
